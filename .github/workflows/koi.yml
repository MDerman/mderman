name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, scripts/koi-legend.py]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi
      - name: Draw the language legend
        run: python3 scripts/koi-legend.py "$RUNNER_TEMP/koi-snapshot.json" koi/legend.svg
      - name: Commit the koi and legend if they changed
        shell: bash
        run: |
          git add koi/koi.gif koi/legend.svg
          if git diff --cached --quiet; then
            echo "The koi and legend are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: update koi and language legend"
          git push --quiet
